<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact Fruité 🍓🧢</title>

  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .contact-container {
      background: #fff7f8;
      padding: 30px;
      border-radius: 20px;
      width: 420px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .contact-container h1 {
      margin-bottom: 20px;
      color: #e63946;
      font-size: 28px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 2px solid #ff6b81;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #ff6b81;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* Décorations fruitées et fun */
    .fruit {
      position: absolute;
      width: 50px;
      opacity: 0.7;
      animation: float 6s infinite;
    }

    .fruit:nth-child(1) { top: -20px; left: 10%; }
    .fruit:nth-child(2) { top: 0; right: 15%; width: 60px; }
    .fruit:nth-child(3) { bottom: -10px; left: 20%; width: 40px; }
    .fruit:nth-child(4) { bottom: 10px; right: 25%; width: 55px; }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg);}
      50% { transform: translateY(-15px) rotate(20deg);}
      100% { transform: translateY(0) rotate(0deg);}
    }
  </style>
</head>

<body>

  <div class="contact-container">
    <h1>Contact Fruité 🍓🧢</h1>

    <form>
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" placeholder="Votre prénom">

      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Votre nom">

      <label for="message">Message</label>
      <textarea id="message" placeholder="Votre message..."></textarea>

      <button type="submit">Envoyer 🍓</button>
    </form>

    <img src="https://i.imgur.com/5F9k8nE.png" class="fruit" alt="Fraise" />
    <img src="https://i.imgur.com/YzVljqA.png" class="fruit" alt="Charlotte aux fraises" />
    <img src="https://i.imgur.com/1lXr6mr.png" class="fruit" alt="Casquette Gucci" />
    <img src="https://i.imgur.com/5F9k8nE.png" class="fruit" alt="Fraise" />

  </div>

</body>
</html>
