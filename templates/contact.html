<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact de la Muerte 💀⚡</title>

  <!-- Police gothique -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'UnifrakturCook', Arial, sans-serif;
      background: #0b0c10;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .contact-container {
      background: rgba(20, 20, 30, 0.95);
      padding: 30px;
      border-radius: 20px;
      width: 450px;
      box-shadow: 0 0 40px #00f0ff;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #ff3333;
      text-shadow: 2px 2px 8px #000;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 400;
      color: #f0f0f0;
      text-align: left;
      font-family: Arial, sans-serif; /* plus lisible pour les labels */
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 2px solid #ff3333;
      background: #1f1f2f;
      color: #fff;
      font-size: 14px;
      font-family: Arial, sans-serif; /* plus lisible pour le formulaire */
    }

    textarea {
      resize: none;
      height: 100px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #ff3333;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: 500;
      font-family: Arial, sans-serif; /* bouton lisible */
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff3333;
    }
  </style>

</head>

<body>

  <div class="contact-container">
    <h1>Contact de la Muerte 💀⚡</h1>

    <form>
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" placeholder="Votre prénom">

      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Votre nom">

      <label for="message">Message</label>
      <textarea id="message" placeholder="Votre message..."></textarea>

      <button type="submit">Envoyer 🔥</button>
    </form>
  </div>

</body>
</html>
