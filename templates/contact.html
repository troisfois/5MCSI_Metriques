<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact de la Muerte 💀🦖⚡</title>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: #0b0c10;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .contact-container {
      background: rgba(20, 20, 30, 0.95);
      padding: 30px;
      border-radius: 20px;
      width: 450px;
      box-shadow: 0 0 40px #00f0ff;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
      color: #ff3333;
      font-weight: 500;
      text-shadow: 1px 1px 6px #000;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 400;
      color: #f0f0f0;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 2px solid #ff3333;
      background: #1f1f2f;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #ff3333;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: 500;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff3333;
    }

    /* Décorations */
    .dino, .foudre, .medaille {
      position: absolute;
      width: 60px;
      animation: float 5s infinite alternate;
      opacity: 0.8;
    }

    .dino:nth-child(1) { top: 10px; left: 5%; width: 70px; }
    .dino:nth-child(2) { bottom: 20px; right: 10%; width: 80px; }

    .foudre:nth-child(3) { top: -20px; left: 40%; width: 60px; animation: flash 1.5s infinite; }
    .foudre:nth-child(4) { top: -20px; right: 35%; width: 60px; animation: flash 1.2s infinite; }

    .medaille:nth-child(5) { top: 20%; left: 15%; width: 50px; animation: float 6s infinite alternate-reverse; }
    .medaille:nth-child(6) { top: 60%; right: 20%; width: 45px; animation: float 7s infinite alternate; }
    .medaille:nth-child(7) { bottom: 10%; left: 50%; width: 55px; animation: float 5s infinite alternate-reverse; }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(10deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes flash {
      0%, 50%, 100% { opacity: 0.8; }
      25%, 75% { opacity: 1; transform: translateY(-5px) rotate(5deg); }
    }
  </style>

  <!-- Google Font Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>

  <div class="contact-container">
    <h1>Contact de la Muerte 💀🦖⚡</h1>

    <form>
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" placeholder="Votre prénom">

      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Votre nom">

      <label for="message">Message</label>
      <textarea id="message" placeholder="Votre message..."></textarea>

      <button type="submit">Envoyer 🔥</button>
    </form>

    <!-- Images décoratives -->
    <img src="https://i.imgur.com/qkQ1Z8n.png" class="dino" alt="Dino 1" />
    <img src="https://i.imgur.com/06mFzZy.png" class="dino" alt="Dino 2" />
    <img src="https://i.imgur.com/4U9Utkd.png" class="foudre" alt="Foudre 1" />
    <img src="https://i.imgur.com/TzH7oGQ.png" class="foudre" alt="Foudre 2" />

    <!-- Médailles -->
    <img src="https://i.imgur.com/JqYcE5f.png" class="medaille" alt="Médaille 1" />
    <img src="https://i.imgur.com/JqYcE5f.png" class="medaille" alt="Médaille 2" />
    <img src="https://i.imgur.com/JqYcE5f.png" class="medaille" alt="Médaille 3" />

  </div>

</body>
</html>
