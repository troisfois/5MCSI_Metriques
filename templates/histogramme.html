<html>
  <head>
    <meta charset="UTF-8" />
    <title>Histogramme – Tawarano</title>
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js">
    </script>
  </head>

  <body>
    <h1>Évolution des températures à Tawarano</h1>
    <div id="chart_div" style="width: 900px; height: 500px;"></div>

    <script>
      // Chargement de Google Charts
      google.charts.load('current', { packages: ['corechart'] });
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {

        // Création du tableau de données
        var data = new google.visualization.DataTable();
        data.addColumn('string', 'Jour');
        data.addColumn('number', 'Température (°C)');

        // Données des températures
        data.addRows([
          ['Lundi', 12],
          ['Mardi', 15],
          ['Mercredi', 14],
          ['Jeudi', 18],
          ['Vendredi', 16],
          ['Samedi', 19],
          ['Dimanche', 17]
        ]);

        // Options du graphique
        var options = {
          title: 'Évolution des températures de la ville de Tawarano',
          hAxis: { title: 'Jour' },
          vAxis: { title: 'Température (°C)' },
          legend: { position: 'none' }
        };

        // Création de l’histogramme (graphique à colonnes)
        var chart = new google.visualization.ColumnChart(
          document.getElementById('chart_div')
        );

        chart.draw(data, options);
      }
    </script>
  </body>
</html>
