<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Commits de la Muerte 💀⚡</title>

  <!-- Police gothique pour le titre -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: #0b0c10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-top: 50px;
    }

    h1 {
      font-family: 'UnifrakturCook', cursive;
      font-size: 36px;
      color: #ff3333;
      text-shadow: 2px 2px 8px #000;
      margin-bottom: 40px;
      text-align: center;
    }

    #chart_div {
      width: 90%;
      max-width: 900px;
      height: 500px;
      background: rgba(20, 20, 30, 0.95);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 40px #00f0ff;
    }

    /* Style du graphique Google Charts via CSS hack */
    .google-visualization-tooltip {
      font-family: 'Poppins', Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Commits de la Muerte 💀⚡</h1>

  <div id="chart_div"></div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(drawChart);

    async function drawChart() {
      // Récupération des commits depuis l'API GitHub
      const response = await fetch('https://api.github.com/repos/OpenRSI/5MCSI_Metriques/commits');
      const data = await response.json();

      // Comptage des commits par minute
      const minutesCount = Array(60).fill(0);
      data.forEach(commit => {
        const dateStr = commit.commit.author.date;
        const dateObj = new Date(dateStr);
        const minute = dateObj.getUTCMinutes();
        minutesCount[minute]++;
      });

      // Préparation des données pour Google Charts
      const chartData = [['Minute', 'Commits']];
      for (let i = 0; i < 60; i++) {
        chartData.push([i.toString(), minutesCount[i]]);
      }

      const dataTable = google.visualization.arrayToDataTable(chartData);

      const options = {
        title: 'Commits par minute',
        legend: { position: 'bottom', textStyle: {color: '#fff', fontName: 'Poppins'} },
        hAxis: {
          title: 'Minute de l\'heure',
          titleTextStyle: { color: '#fff', fontSize: 14 },
          textStyle: { color: '#fff' },
          gridlines: { color: '#333' }
        },
        vAxis: {
          title: 'Nombre de commits',
          titleTextStyle: { color: '#fff', fontSize: 14 },
          textStyle: { color: '#fff' },
          gridlines: { color: '#333' }
        },
        colors: ['#ff3333'],
        backgroundColor: 'transparent',
        chartArea: { width: '85%', height: '70%' },
      };

      const chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
      chart.draw(dataTable, options);
    }
  </script>

</body>
</html>
